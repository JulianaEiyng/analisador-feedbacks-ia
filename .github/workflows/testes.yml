name: Testes leves

on:
  push:
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências de teste
        run: python -m pip install pandas scikit-learn transformers streamlit pytest
      - name: Executar testes sem baixar o modelo
        run: pytest -q tests
